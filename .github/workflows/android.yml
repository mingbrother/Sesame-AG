name: Release Build Debug
run-name: Release Build Debug - ${{ github.ref_name || 'Manual Run' }}

on:
  push:
    tags:
      - "[0-9]*-*"
  workflow_dispatch:

env:
  CI: "true"
  JAVA_DISTRIBUTION: "oracle"
  JAVA_VERSION: "17.0.1"
  ANDROID_API_LEVEL: "37"
  ANDROID_PLATFORM: "android-37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"
  RELEASE_DIR: app/build/outputs/apk/release
  STAGING_DIR: app/build/outputs/apk/all
  ASSET_DIR: app/build/outputs/apk/release-assets
  RELEASE_TAG_RAW: ${{ github.ref_name || 'manual-build' }}

concurrency:
  group: release-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Set Timezone to Asia/Shanghai
        shell: bash
        run: |
          set -euo pipefail
          sudo timedatectl set-timezone Asia/Shanghai
          echo "Current time: $(date)"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          architecture: x64
          check-latest: false
          cache: gradle

      - name: Pin Gradle Java Home
        shell: bash
        run: |
          set -euo pipefail
          echo "ORG_GRADLE_JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Required Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Print Toolchain Versions
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME}"
          echo "ORG_GRADLE_JAVA_HOME=${ORG_GRADLE_JAVA_HOME}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          java -version
          sdkmanager --version
          ./gradlew --version

      - name: Build Release APKs (Unsigned)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${STAGING_DIR}" "${ASSET_DIR}"
          mkdir -p "${STAGING_DIR}" "${ASSET_DIR}"
          mapfile -t apks < <(find "${RELEASE_DIR}" -maxdepth 1 -type f -name "*.apk" | sort)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "No release APK found!" >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp "${apk}" "${ASSET_DIR}/"
          done

      - name: Generate simple changelog
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          body_path="${RUNNER_TEMP}/changelog.md"
          echo "# 手动构建（未签名APK）" > "${body_path}"
          echo "提交: \`${GITHUB_SHA}\`" >> "${body_path}"
          echo "">>"${body_path}"
          echo "> ⚠️ 此包为【未签名APK】，**不能直接安装到手机**，需要后续签名后才能使用" >> "${body_path}"
          echo "body_path=${body_path}" >> "$GITHUB_OUTPUT"
          cp "${body_path}" "${ASSET_DIR}/changelog.md"

      - name: Zip artifacts
        shell: bash
        run: |
          set -euo pipefail
          artifact_path="${RUNNER_TEMP}/APK-${RELEASE_TAG_RAW}.zip"
          cd "${ASSET_DIR}"
          zip -r "${artifact_path}" .
          echo "artifact_path=${artifact_path}" >> "$GITHUB_ENV"

      - name: Upload Unsigned APK Zip
        uses: actions/upload-artifact@v7
        with:
          name: Unsigned-APK-${{ env.RELEASE_TAG_RAW }}
          archive: false
          path: ${{ env.artifact_path }}
          if-no-files-found: error
